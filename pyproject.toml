[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "equivalencekit"
version = "0.1.0"
description = "Equivalence and validator patterns for GenLayer Intelligent Contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EquivalenceKit contributors" }]
keywords = ["genlayer", "intelligent-contracts", "equivalence", "validators", "consensus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
ekit = "equivalencekit.cli:main"

[tool.setuptools]
packages = ["equivalencekit"]
include-package-data = true

[tool.setuptools.package-data]
equivalencekit = ["py.typed"]
