name: Bug report
description: Something in EquivalenceKit is wrong or fails a gate
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A bug here is a wrong report, not just a crash: a comparator that accepts
        garbage, an audit finding that is misleading, a test that cannot fail.
  - type: input
    id: version
    attributes:
      label: equivalencekit version
      description: "`pip show equivalencekit`, `ekit --version`, or the commit hash"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: "Command run and the output you got (never partial output) — e.g. `ekit tighten --rules … --fixtures …`"
      placeholder: "paste command + output"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: "What the tool should have reported instead"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "GenLayer network, Python/Node version, anything else that matters"
    validations:
      required: false
