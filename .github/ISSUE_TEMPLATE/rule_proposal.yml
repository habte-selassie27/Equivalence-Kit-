name: Rule proposal
description: Propose a new equivalence pattern, comparator, or anti-pattern
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Good proposals say what the rule decides, not just what it compares. If the
        proposal is an anti-pattern, include the input that exposes it — every entry in
        docs/anti-patterns.md is paired with a failing case, and new ones should be too.
  - type: dropdown
    id: kind
    attributes:
      label: What is this?
      options:
        - "A new pattern (P7+) or variant"
        - "A comparator/normalizer primitive"
        - "An anti-pattern for `ekit audit`"
        - "An `ekit` CLI feature (tighten / audit / scaffold / matrix / diagnose)"
        - "A browser playground feature"
        - "Something else"
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: The decision being enforced
      description: "What validators must agree on; what must never change the decision; what happens when the source is down"
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: Acceptance matrix sketch
      description: "Inputs that MUST be accepted, inputs that MUST be rejected, boundary cases at every tolerance edge"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Why it is needed
      description: "Real output, a failed consensus round, or a contract the audit should catch"
    validations:
      required: true
