name: ekit audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  security-events: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # SARIF feeds GitHub code scanning: findings appear on the PR and in the
      # Security tab. The command still exits non-zero on findings, so audit.yml
      # doubles as a merge gate.
      - run: ekit audit contracts/ --sarif audit.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: audit.sarif
