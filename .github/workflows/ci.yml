name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install genvm-linter genlayer-test
      - name: Primitives
        run: python -m pytest tests/primitives -q
      - name: Matrices
        run: python -m pytest tests/matrices -q
      - name: Direct
        run: python -m pytest tests/direct -q
      - name: Lint contracts
        run: |
          for f in contracts/verdict_judge.py contracts/web_fact_attestor.py contracts/ranking_judge.py contracts/fixtures/consensus_probe.py; do
            genvm-lint check "$f" --json
          done
      - name: Vendor freshness
        run: python tools/vendor.py --check
