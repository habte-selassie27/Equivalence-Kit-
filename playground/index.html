<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eef2f0" />
    <script>
      /* Theme bootstrap: stamp data-theme before first paint so switching modes
         never flashes. Same rule as src/lib/theme.ts: stored override, else the
         OS preference, else light. */
      (function () {
        var forced = "light";
        try {
          var stored = localStorage.getItem("ek-theme");
          var mediaDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          forced =
            stored === "dark" || stored === "light"
              ? stored
              : mediaDark
                ? "dark"
                : "light";
        } catch (error) {
          forced = "light";
        }
        document.documentElement.setAttribute("data-theme", forced);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && forced === "dark") meta.setAttribute("content", "#0f1512");
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%234a3fbf'/%3E%3Crect x='7' y='8' width='6' height='16' fill='%231b2a2f'/%3E%3Crect x='19' y='8' width='6' height='16' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>EquivalenceKit Playground</title>
    <meta
      name="description"
      content="An optional companion for EquivalenceKit: run the real equivalence rules and see exactly what they accept and reject."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
